<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>{% block title %}Demo PSAR{% endblock %}</title>
   <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
   {% block head %}{% endblock %}
</head>

<body>
   <header class="topbar">
      <a class="brand" href="/">Demo PSAR</a>
      <nav class="nav">
         <a href="/docs">API Docs</a>
         <a data-auth-link="guest" href="/login">Login</a>
         <a data-auth-link="guest" href="/register">Register</a>
         <a data-auth-link="user" href="/dashboard">Dashboard</a>
         <button class="link-button" type="button" data-auth-link="user" data-logout>Logout</button>
      </nav>
   </header>

   <main class="page">
      {% block content %}{% endblock %}
   </main>

   <div class="toast" data-flash hidden></div>
   <script type="module" src="{{ url_for('static', path='/js/auth.js') }}"></script>
   {% block scripts %}{% endblock %}
</body>

</html>
