{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<section class="dashboard-header">
   <div>
      <p class="eyebrow">Private area</p>
      <h1>Dashboard</h1>
      <p class="muted">Signed in as <strong data-current-user>loading...</strong></p>
   </div>
   <button type="button" data-logout>Logout</button>
</section>

<section class="grid two">
   <form class="panel" id="visitor-form">
      <h2>Add visitor</h2>
      <label for="visitor-name">Visitor name</label>
      <div class="inline-form">
         <input type="text" id="visitor-name" placeholder="Visitor name" required>
         <button type="submit">Add</button>
      </div>
      <p class="message" id="form-message"></p>
   </form>

   <section class="panel">
      <div class="section-heading">
         <h2>My visitors</h2>
         <button class="secondary" type="button" id="refresh-visitors">Refresh</button>
      </div>
      <ul class="list visitors" id="visitors-list"></ul>
      <p class="muted" id="empty-state" hidden>No visitors yet.</p>
   </section>
</section>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', path='/js/dashboard.js') }}"></script>
{% endblock %}
