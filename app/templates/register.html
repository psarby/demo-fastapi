{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<section class="auth-layout">
   <form class="panel auth-card" data-auth-form="register">
      <p class="eyebrow">New account</p>
      <h1>Register</h1>

      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="4" required>

      <button class="full-width" type="submit">Create account</button>
      <p class="message" data-form-message></p>
      <p class="muted">Already registered? <a href="/login">Login</a>.</p>
   </form>
</section>
{% endblock %}
